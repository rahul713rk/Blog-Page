<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonicalUrl}}">
  <link rel="icon" type="image/svg+xml" href="{{sitePath}}/assets/icons/book.svg">
  <script>
    document.documentElement.classList.add("js");
    try {
      const root = document.documentElement;
      const savedTheme = localStorage.getItem("blog-theme");
      if (["github-dark", "abyss", "light-modern", "light-plus"].includes(savedTheme)) {
        root.dataset.theme = savedTheme;
      }

      const savedCodeTheme = localStorage.getItem("blog-code-theme");
      if (["github-dark", "abyss", "light-modern", "light-plus"].includes(savedCodeTheme)) {
        root.dataset.codeTheme = savedCodeTheme;
      }

      const savedDiagramTheme = localStorage.getItem("blog-diagram-theme");
      if (["github-dark", "abyss", "light-modern", "light-plus"].includes(savedDiagramTheme)) {
        root.dataset.diagramTheme = savedDiagramTheme;
      }
    } catch { }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism.min.css">
  <link rel="stylesheet" href="{{sitePath}}/assets/css/site.css">
  {{head}}
</head>

<body data-site-path="{{sitePath}}">
  <div class="page-shell">
    <header class="site-header">
      <nav class="glass-nav">
        <a class="brand-link" href="{{homeHref}}" aria-label="{{siteName}} home">
          <span class="brand-mark">
            <img src="{{sitePath}}/assets/icons/book-rack-cabinet.svg" alt="">
          </span>
          <span class="brand-copy">
            <strong>{{siteName}}</strong>
            <small>Blogs and guides</small>
          </span>
        </a>

        <div class="nav-links">
          <a href="{{homeHref}}#blogs-section">Blogs</a>
          <a href="{{homeHref}}#guides-section">Guides</a>

          <details class="theme-dropdown" data-theme-group="page">
            <summary class="theme-trigger" aria-label="Site theme switcher">
              <span class="theme-trigger-icon" data-theme-active-icon aria-hidden="true">
                <img class="theme-icon-image" src="{{sitePath}}/assets/icons/theme-github-dark.svg" alt=""
                  aria-hidden="true">
              </span>
            </summary>

            <div class="theme-menu">
              <button class="theme-option" type="button" data-theme-option="github-dark" aria-label="GitHub Dark theme"
                title="GitHub Dark">
                <span class="theme-option-icon" aria-hidden="true">
                  <img class="theme-icon-image" src="{{sitePath}}/assets/icons/theme-github-dark.svg" alt=""
                    aria-hidden="true">
                </span>
              </button>
              <button class="theme-option" type="button" data-theme-option="abyss" aria-label="Abyss theme"
                title="Abyss">
                <span class="theme-option-icon" aria-hidden="true">
                  <img class="theme-icon-image" src="{{sitePath}}/assets/icons/theme-abyss.svg" alt=""
                    aria-hidden="true">
                </span>
              </button>
              <button class="theme-option" type="button" data-theme-option="light-modern"
                aria-label="Light Modern theme" title="Light Modern">
                <span class="theme-option-icon" aria-hidden="true">
                  <img class="theme-icon-image" src="{{sitePath}}/assets/icons/theme-light-modern.svg" alt=""
                    aria-hidden="true">
                </span>
              </button>
              <button class="theme-option" type="button" data-theme-option="light-plus"
                aria-label="Light+ theme" title="Light+">
                <span class="theme-option-icon" aria-hidden="true">
                  <img class="theme-icon-image" src="{{sitePath}}/assets/icons/theme-light-plus.svg" alt=""
                    aria-hidden="true">
                </span>
              </button>
            </div>
          </details>

          <a href="{{homeHref}}#about-section">About Me</a>
        </div>
      </nav>
    </header>

    <main class="container site-main">
      {{content}}
    </main>

    <footer class="site-footer">
      <p>&copy; {{year}} {{siteName}}. All rights reserved.</p>
    </footer>
  </div>


  <button class="scroll-top-button" type="button" aria-label="Scroll to top">↑</button>

  <script defer src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
</body>

</html>
