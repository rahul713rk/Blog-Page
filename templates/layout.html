<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonicalUrl}}">

  <script>
    document.documentElement.classList.add("js");
    try {
      const root = document.documentElement;
      const savedTheme = localStorage.getItem("blog-theme");
      if (["github-dark", "abyss", "light-modern", "light-plus"].includes(savedTheme)) {
        root.dataset.theme = savedTheme;
      }

      const savedCodeTheme = localStorage.getItem("blog-code-theme");
      if (["github-dark", "abyss", "light-modern", "light-plus"].includes(savedCodeTheme)) {
        root.dataset.codeTheme = savedCodeTheme;
      }

      const savedDiagramTheme = localStorage.getItem("blog-diagram-theme");
      if (["github-dark", "abyss", "light-modern", "light-plus"].includes(savedDiagramTheme)) {
        root.dataset.diagramTheme = savedDiagramTheme;
      }
    } catch { }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="{{sitePath}}/assets/css/site.css">
  <script type="module" src="{{sitePath}}/assets/js/site.js"></script>
  <meta name="robots" content="index, follow">
  <link rel="alternate" type="application/rss+xml" title="{{siteName}}" href="{{baseUrl}}/feed.xml">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonicalUrl}}">
  <meta property="og:site_name" content="{{siteName}}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  {{head}}
</head>


<body data-site-path="{{sitePath}}">
  <div class="page-shell">
    <header class="site-header">
      <nav class="glass-nav reveal-on-scroll">
        <a class="brand-link" href="{{homeHref}}" aria-label="{{siteName}} home">
          <span class="brand-copy">
            <strong>{{siteName}}</strong>
            <small>Blogs and guides</small>
          </span>
        </a>

        <div class="nav-links">
          <a href="{{homeHref}}" {{homeActive}}>Home</a>
          <a href="{{sitePath}}/posts/" {{blogsActive}}>Blogs</a>
          <a href="{{sitePath}}/guides/" {{guidesActive}}>Guides</a>

          <details class="theme-dropdown" data-theme-group="page">
            <summary class="theme-trigger" aria-label="Site theme switcher">
              <span class="theme-trigger-icon" data-theme-active-icon aria-hidden="true">
                Theme
              </span>
            </summary>

            <div class="theme-menu">
              <button class="theme-option" type="button" data-theme-option="github-dark" title="GitHub Dark">GD</button>
              <button class="theme-option" type="button" data-theme-option="abyss" title="Abyss">AB</button>
              <button class="theme-option" type="button" data-theme-option="light-modern" title="Light Modern">LM</button>
              <button class="theme-option" type="button" data-theme-option="light-plus" title="Light+">LP</button>
            </div>
          </details>

          <a href="{{sitePath}}/about/index.html" {{aboutActive}}>About Me</a>
        </div>
      </nav>
    </header>

    <main class="container">
      {{content}}
    </main>

    <footer class="site-footer reveal-on-scroll">
      <div class="footer-content">
        <p>made with ❤️ by rahul | <a href="https://github.com/rahul713rk" target="_blank" rel="noopener noreferrer">GitHub</a></p>
      </div>
    </footer>
  </div>

  <button class="scroll-top-button" type="button" aria-label="Scroll to top">
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
      <path d="M8 2L2 10h4v4h4v-4h4L8 2z" />
    </svg>
  </button>

  <script defer src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
</body>

</html>
